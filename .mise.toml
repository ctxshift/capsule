[tools]
bun = "1.3.6"
node = "25.6.1"
zig = "0.16.0"
"github:ctxshift/bees" = "0.4.0"

[tasks.install]
description = "Install the frozen authoring workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.typecheck]
description = "Typecheck all authoring, example and feature workspaces"
run = "bun run typecheck"

[tasks.test]
description = "Run feature and authoring tests"
run = "bun run test"

[tasks.js-check]
description = "Lint and check formatting of TypeScript and JavaScript"
run = "bun run check:js"

[tasks.js-format]
description = "Format authored TypeScript, JavaScript and package metadata"
run = "bun run format"

[tasks.check]
description = "Check workspace types, source quality, contracts and native imports"
depends = ["typecheck", "js-check", "check-features"]
run = "node tools/verify-native-import.mjs"

[tasks.check-features]
description = "Check contract generation, dependencies and native providers"
run = "bun run check:features"

[tasks.generate]
description = "Regenerate reusable feature contracts and example bindings"
run = "bun run generate:features"

[tasks.build-sdk]
description = "Build the React host SDK without installing it into an engine"
run = "bun run build:sdk"

[tasks.dev]
description = "Run the neutral React UI workshop and browser preview"
raw = true
run = "bun run dev:demo"

[tasks.release-build]
description = "Build a committed npm and GitHub engine candidate; pass --output"
run = "bun run release:build"

[tasks.release-verify]
description = "Verify packed npm and direct DLL consumers; pass --artifacts"
run = "bun run release:verify"

[tasks.release-reproduce]
description = "Build twice and compare complete candidates; pass --output"
run = "bun run release:reproduce"

[tasks.godot-build]
description = "Build the standard Godot Windows x64 addon; pass --output"
run = "node tools/capsule-godot/build.mjs"

[tasks.godot-verify]
description = "Run the real Godot React development proof; pass --godot and --output"
run = "bun tools/capsule-godot/verify.ts"
